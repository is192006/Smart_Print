services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartprint
      POSTGRES_PASSWORD: smartprint
      POSTGRES_DB: smartprint
    ports:
      # Host port 5433 (not 5432) -- avoids colliding with a native
      # PostgreSQL service that may already be running on the host.
      - "5433:5432"
    volumes:
      - smartprint_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartprint"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://smartprint:smartprint@db:5432/smartprint?schema=public
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  smartprint_db_data:
  backend_node_modules:
  backend_uploads:
  frontend_node_modules:
